<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>forma-smart-brush — Test Page</title>
  <style>
    body { background: #121315; color: #dedee4; font-family: sans-serif; display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100vh; margin: 0; }
    canvas { background: #faf9f5; border-radius: 8px; cursor: crosshair; box-shadow: 0 10px 30px rgba(0,0,0,0.5); }
    .hint { margin-top: 12px; font-size: 13px; color: #a6a8b0; }
  </style>
</head>
<body>
  <canvas id="canvas" width="800" height="500"></canvas>
  <div class="hint">forma-smart-brush test page: Draw lines/curves with guidelines, Spacebar to cycle, endpoint welding active.</div>

  <script type="module">
    import { SmartBrushCanvas } from './src/smart-brush.js';
    const canvas = document.getElementById('canvas');
    const smartBrush = new SmartBrushCanvas(canvas, { color: '#a9ec68', weldDistance: 30 });
  </script>
</body>
</html>
