<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>forma-smart-brush — High-Performance Studio</title>
  <style>
    body { background: #121315; color: #dedee4; font-family: sans-serif; display: flex; height: 100vh; margin: 0; overflow: hidden; }
    .sidebar { width: 240px; background: #17181a; border-right: 1px solid #292a2f; display: flex; flex-direction: column; padding: 16px; gap: 16px; }
    .section-title { font-size: 12px; text-transform: uppercase; color: #a6a8b0; letter-spacing: 0.5px; margin-bottom: 8px; }
    .colors { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; }
    .color-btn { width: 100%; height: 32px; border: 2px solid transparent; border-radius: 6px; cursor: pointer; }
    .color-btn.active { border-color: #fff; }
    .tools-list { display: flex; flex-direction: column; gap: 6px; }
    .tool-btn { background: #121315; border: 1px solid #292a2f; color: #dedee4; padding: 10px; border-radius: 6px; cursor: pointer; text-align: left; font-size: 13px; }
    .tool-btn:hover { background: #292a2f; }
    .tool-btn.active { border-color: #8d71ff; background: #34363c; color: #8d71ff; }
    .canvas-container { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; background: #121315; position: relative; }
    canvas { background: #faf9f5; border-radius: 8px; cursor: crosshair; box-shadow: 0 10px 30px rgba(0,0,0,0.5); }
    .hint { margin-top: 12px; font-size: 13px; color: #a6a8b0; }
    button { cursor: pointer; }
  </style>
</head>
<body>
  <div class="sidebar">
    <div>
      <div class="section-title">Tools</div>
      <div class="tools-list">
        <button class="tool-btn active" data-tool="line-tool">╱ Line & Curve Tool (L)</button>
        <button class="tool-btn" data-tool="shape-tool">⬛ Shape Tool (S)</button>
      </div>
    </div>
    <div>
      <div class="section-title">Colors</div>
      <div class="colors">
        <button class="color-btn active" style="background: #a9ec68;" data-color="#a9ec68"></button>
        <button class="color-btn" style="background: #c4a6ff;" data-color="#c4a6ff"></button>
        <button class="color-btn" style="background: #ff8b78;" data-color="#ff8b78"></button>
        <button class="color-btn" style="background: #73c8ef;" data-color="#73c8ef"></button>
        <button class="color-btn" style="background: #ffd166;" data-color="#ffd166"></button>
        <button class="color-btn" style="background: #ffffff;" data-color="#ffffff"></button>
        <button class="color-btn" style="background: #191a1d;" data-color="#191a1d"></button>
        <input type="color" id="color-picker" value="#a9ec68" style="width: 100%; height: 32px; border: 1px solid #292a2f; background: #121315; border-radius: 6px; cursor: pointer; padding: 0;">
      </div>
    </div>
    <div style="margin-top: auto;">
      <button id="clear" style="width: 100%; background: transparent; border: 1px solid #292a2f; color: #dedee4; padding: 10px; border-radius: 6px; font-size: 13px;">Clear Canvas</button>
    </div>
  </div>

  <div class="canvas-container">
    <canvas id="canvas" width="800" height="500"></canvas>
    <div class="hint" id="hint">Line Tool Active: Press SPACEBAR to cycle guidelines instantly (Start & End Welding active).</div>
  </div>

  <script>
    const canvas = document.getElementById('canvas');
    const ctx = canvas.getContext('2d');
    let tool = 'line-tool';
    let currentColor = '#a9ec68';
    let drawStart = null;
    let drawPoints = [];
    const elements = [];
    let spaceCycleIndex = 0;

    let cachedEndpoints = [];
    function updateEndpointsCache() {
      cachedEndpoints = [];
      elements.forEach(el => {
        if (el.points && el.points.length > 0) {
          cachedEndpoints.push(el.points[0], el.points[el.points.length - 1]);
        } else if (el.type === 'rect' || el.type === 'circle') {
          cachedEndpoints.push({ x: el.x || 0, y: el.y || 0 });
        }
      });
    }

    document.getElementById('color-picker').addEventListener('input', e => { currentColor = e.target.value; });

    document.querySelectorAll('.tool-btn').forEach(btn => {
      btn.addEventListener('click', () => {
        document.querySelectorAll('.tool-btn').forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
        tool = btn.dataset.tool;
        document.getElementById('hint').textContent = `${tool === 'line-tool' ? 'Line Tool Active: Press SPACEBAR to cycle guidelines instantly' : 'Shape Tool Active: Drag to create shapes'}`;
      });
    });

    document.querySelectorAll('.color-btn').forEach(btn => {
      btn.addEventListener('click', () => {
        document.querySelectorAll('.color-btn').forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
        currentColor = btn.dataset.color;
        document.getElementById('color-picker').value = currentColor;
      });
    });

    document.getElementById('clear').addEventListener('click', () => { elements.length = 0; updateEndpointsCache(); redraw(); });

    function redraw() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      ctx.strokeStyle = '#ecebe6'; ctx.lineWidth = 1;
      for (let x = 0; x < canvas.width; x += 40) { ctx.beginPath(); ctx.moveTo(x, 0); ctx.lineTo(x, canvas.height); ctx.stroke(); }
      for (let y = 0; y < canvas.height; y += 40) { ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(canvas.width, y); ctx.stroke(); }

      elements.forEach(el => {
        ctx.save();
        ctx.fillStyle = el.color; ctx.strokeStyle = '#191a1d'; ctx.lineWidth = 2;
        if (el.type === 'circle' || el.type === 'oval') {
          ctx.beginPath();
          if (el.type === 'circle') ctx.arc(el.x, el.y, el.radius, 0, Math.PI * 2);
          else ctx.ellipse(el.x, el.y, el.rx, el.ry, 0, 0, Math.PI * 2);
          ctx.fill(); ctx.stroke();
        } else if (el.type === 'rect') {
          ctx.fillRect(el.x, el.y, el.w, el.h); ctx.strokeRect(el.x, el.y, el.w, el.h);
        } else if (el.type === 'line' || el.type === 'curve' || el.type === 'half-circle') {
          ctx.beginPath();
          el.points.forEach((p, i) => i ? ctx.lineTo(p.x, p.y) : ctx.moveTo(p.x, p.y));
          ctx.strokeStyle = el.color; ctx.lineWidth = 3; ctx.stroke();
        } else if (el.type === 'bezier' || el.type === 'cubic-bezier' || el.type === 'smooth-bezier') {
          ctx.beginPath();
          ctx.moveTo(el.start.x, el.start.y);
          if (el.cp2) ctx.bezierCurveTo(el.cp1.x, el.cp1.y, el.cp2.x, el.cp2.y, el.end.x, el.end.y);
          else ctx.quadraticCurveTo(el.cp.x, el.cp.y, el.end.x, el.end.y);
          ctx.strokeStyle = el.color; ctx.lineWidth = 3; ctx.stroke();
        }
        ctx.restore();
      });
    }

    canvas.addEventListener('pointerdown', e => {
      const rect = canvas.getBoundingClientRect();
      const point = { x: e.clientX - rect.left, y: e.clientY - rect.top };
      
      let nearest = null; let minDist = Infinity;
      cachedEndpoints.forEach(ep => {
        const d = Math.hypot(point.x - ep.x, point.y - ep.y);
        if (d < minDist) { minDist = d; nearest = ep; }
      });

      drawStart = (nearest && minDist < 30) ? nearest : point;
      drawPoints = [drawStart];
    });

    canvas.addEventListener('pointermove', e => {
      if (!drawStart) return;
      const rect = canvas.getBoundingClientRect();
      const p = { x: e.clientX - rect.left, y: e.clientY - rect.top };
      const last = drawPoints[drawPoints.length - 1];
      if (Math.hypot(p.x - last.x, p.y - last.y) > 3) drawPoints.push(p);
      redraw();

      const currentPoints = [...drawPoints, p];

      ctx.save();
      ctx.strokeStyle = currentColor; ctx.lineWidth = 3; ctx.lineCap = 'round'; ctx.lineJoin = 'round';
      ctx.beginPath();
      drawPoints.forEach((pt, i) => i ? ctx.lineTo(pt.x, pt.y) : ctx.moveTo(pt.x, pt.y));
      ctx.lineTo(p.x, p.y);
      ctx.stroke();

      if (tool === 'line-tool' && currentPoints.length > 2) {
        const start = currentPoints[0], end = currentPoints[currentPoints.length - 1];
        
        let nearestEnd = null; let minEndDist = Infinity;
        cachedEndpoints.forEach(ep => {
          const d = Math.hypot(end.x - ep.x, end.y - ep.y);
          if (d < minEndDist) { minEndDist = d; nearestEnd = ep; }
        });
        const finalEnd = (nearestEnd && minEndDist < 30) ? nearestEnd : end;

        const minX = Math.min(...currentPoints.map(pt => pt.x)), maxX = Math.max(...currentPoints.map(pt => pt.x));
        const minY = Math.min(...currentPoints.map(pt => pt.y)), maxY = Math.max(...currentPoints.map(pt => pt.y));
        const cx = (minX + maxX) / 2, cy = (minY + maxY) / 2;
        const w = maxX - minX, h = maxY - minY;

        const midX = (start.x + finalEnd.x) / 2, midY = (start.y + finalEnd.y) / 2;
        const maxDevPoint = currentPoints.reduce((max, pt) => {
          const d = Math.hypot(pt.x - midX, pt.y - midY);
          return d > max.d ? { x: pt.x, y: pt.y, d } : max;
        }, { x: midX, y: midY, d: 0 });

        const candidates = [
          { name: '1. Straight Line (Weld)', prob: 0.95, draw: () => { ctx.beginPath(); ctx.moveTo(start.x, start.y); ctx.lineTo(finalEnd.x, finalEnd.y); ctx.stroke(); } },
          { name: '2. Smooth Curve', prob: 0.75, draw: () => { ctx.beginPath(); currentPoints.forEach((pt, i) => i ? ctx.lineTo(pt.x, pt.y) : ctx.moveTo(pt.x, pt.y)); ctx.stroke(); } },
          { name: '3. Quadratic Bezier (Arch)', prob: 0.82, draw: () => { ctx.beginPath(); ctx.moveTo(start.x, start.y); ctx.quadraticCurveTo(maxDevPoint.x, maxDevPoint.y, finalEnd.x, finalEnd.y); ctx.stroke(); } },
          { name: '4. Cubic Bezier (S-Curve)', prob: 0.85, draw: () => {
            const cp1 = { x: start.x + (finalEnd.x - start.x) * 0.33, y: start.y + (finalEnd.y - start.y) * 0.8 };
            const cp2 = { x: start.x + (finalEnd.x - start.x) * 0.66, y: start.y + (finalEnd.y - start.y) * 0.2 };
            ctx.beginPath(); ctx.moveTo(start.x, start.y); ctx.bezierCurveTo(cp1.x, cp1.y, cp2.x, cp2.y, finalEnd.x, finalEnd.y); ctx.stroke();
          } },
          { name: '5. Loop / Bow Bezier', prob: 0.78, draw: () => {
            const cp1 = { x: start.x - (finalEnd.y - start.y) * 0.5, y: start.y + (finalEnd.x - start.x) * 0.5 };
            const cp2 = { x: finalEnd.x + (finalEnd.y - start.y) * 0.5, y: finalEnd.y - (finalEnd.x - start.x) * 0.5 };
            ctx.beginPath(); ctx.moveTo(start.x, start.y); ctx.bezierCurveTo(cp1.x, cp1.y, cp2.x, cp2.y, finalEnd.x, finalEnd.y); ctx.stroke();
          } },
          { name: '6. Half-Circle', prob: 0.65, draw: () => { ctx.beginPath(); ctx.arc(cx, cy, Math.max(w, h)/2, Math.PI, 0, false); ctx.stroke(); } }
        ];

        candidates.forEach((cand, idx) => {
          ctx.save();
          ctx.strokeStyle = '#38bdf8';
          const isSelected = (idx === (spaceCycleIndex % candidates.length));
          ctx.lineWidth = isSelected ? 2.8 : 1.2;
          ctx.globalAlpha = isSelected ? 0.98 : Math.max(0.15, cand.prob * 0.6);
          ctx.setLineDash([4, 4]);
          cand.draw();
          ctx.fillStyle = '#38bdf8'; ctx.globalAlpha = isSelected ? 1.0 : 0.6;
          ctx.font = '11px sans-serif';
          ctx.fillText(`${cand.name} ${isSelected ? '[SPACE Active]' : ''} (${Math.round(cand.prob * 100)}%)`, minX, minY - 6 - (idx * 14));
          ctx.restore();
        });

        if (nearestEnd) {
          ctx.save(); ctx.strokeStyle = '#38bdf8'; ctx.lineWidth = 2; ctx.beginPath();
          ctx.arc(nearestEnd.x, nearestEnd.y, 8, 0, Math.PI * 2); ctx.stroke(); ctx.restore();
        }
      } else if (tool === 'shape-tool') {
        const minX = Math.min(...currentPoints.map(pt => pt.x)), maxX = Math.max(...currentPoints.map(pt => pt.x));
        const minY = Math.min(...currentPoints.map(pt => pt.y)), maxY = Math.max(...currentPoints.map(pt => pt.y));
        const w = maxX - minX, h = maxY - minY;
        ctx.save();
        ctx.strokeStyle = '#38bdf8'; ctx.lineWidth = 2; ctx.setLineDash([3, 3]);
        ctx.strokeRect(minX, minY, w, h);
        ctx.restore();
      }

      ctx.restore();
    });

    canvas.addEventListener('pointerup', e => {
      if (!drawStart) return;
      const rect = canvas.getBoundingClientRect();
      const p = { x: e.clientX - rect.left, y: e.clientY - rect.top };
      const raw = [...drawPoints, p];

      if (tool === 'line-tool') {
        const candidates = [
          { id: 'line', prob: 0.95 },
          { id: 'curve', prob: 0.75 },
          { id: 'quadratic', prob: 0.82 },
          { id: 'cubic', prob: 0.85 },
          { id: 'loop', prob: 0.78 },
          { id: 'half-circle', prob: 0.65 }
        ];
        const selected = candidates[spaceCycleIndex % candidates.length];
        const start = raw[0], end = raw[raw.length - 1];

        let nearestEnd = null; let minEndDist = Infinity;
        cachedEndpoints.forEach(ep => {
          const d = Math.hypot(end.x - ep.x, end.y - ep.y);
          if (d < minEndDist) { minEndDist = d; nearestEnd = ep; }
        });
        const finalEnd = (nearestEnd && minEndDist < 30) ? nearestEnd : end;

        if (selected.id === 'line') {
          elements.push({ type: 'line', points: [start, finalEnd], color: currentColor });
        } else if (selected.id === 'curve') {
          elements.push({ type: 'curve', points: raw, color: currentColor });
        } else if (selected.id === 'quadratic') {
          const midX = (start.x + finalEnd.x) / 2, midY = (start.y + finalEnd.y) / 2;
          const maxDevPoint = raw.reduce((max, pt) => {
            const d = Math.hypot(pt.x - midX, pt.y - midY);
            return d > max.d ? { x: pt.x, y: pt.y, d } : max;
          }, { x: midX, y: midY, d: 0 });
          elements.push({ type: 'bezier', start, cp: maxDevPoint, end: finalEnd, color: currentColor });
        } else if (selected.id === 'cubic') {
          const cp1 = { x: start.x + (finalEnd.x - start.x) * 0.33, y: start.y + (finalEnd.y - start.y) * 0.8 };
          const cp2 = { x: start.x + (finalEnd.x - start.x) * 0.66, y: start.y + (finalEnd.y - start.y) * 0.2 };
          elements.push({ type: 'cubic-bezier', start, cp1, cp2, end: finalEnd, color: currentColor });
        } else if (selected.id === 'loop') {
          const cp1 = { x: start.x - (finalEnd.y - start.y) * 0.5, y: start.y + (finalEnd.x - start.x) * 0.5 };
          const cp2 = { x: finalEnd.x + (finalEnd.y - start.y) * 0.5, y: finalEnd.y - (finalEnd.x - start.x) * 0.5 };
          elements.push({ type: 'cubic-bezier', start, cp1, cp2, end: finalEnd, color: currentColor });
        } else if (selected.id === 'half-circle') {
          const minX = Math.min(...raw.map(pt => pt.x)), maxX = Math.max(...raw.map(pt => pt.x));
          const minY = Math.min(...raw.map(pt => pt.y)), maxY = Math.max(...raw.map(pt => pt.y));
          const cx = (minX + maxX) / 2, cy = (minY + maxY) / 2;
          const r = Math.max(maxX - minX, maxY - minY) / 2;
          const pts = [];
          for (let a = Math.PI; a <= Math.PI * 2; a += 0.2) {
            pts.push({ x: cx + Math.cos(a) * r, y: cy + Math.sin(a) * r });
          }
          elements.push({ type: 'half-circle', points: pts, color: currentColor });
        }
      } else if (tool === 'shape-tool') {
        const minX = Math.min(...raw.map(pt => pt.x)), maxX = Math.max(...raw.map(pt => pt.x));
        const minY = Math.min(...raw.map(pt => pt.y)), maxY = Math.max(...raw.map(pt => pt.y));
        const w = maxX - minX, h = maxY - minY;
        const cx = (minX + maxX) / 2, cy = (minY + maxY) / 2;
        if (Math.abs(w - h) < Math.max(w, h) * 0.25) {
          elements.push({ type: 'circle', x: cx, y: cy, radius: Math.max(w, h) / 2, color: currentColor });
        } else {
          elements.push({ type: 'rect', x: minX, y: minY, w, h, color: currentColor });
        }
      }

      drawStart = null; drawPoints = []; spaceCycleIndex = 0;
      updateEndpointsCache();
      redraw();
    });

    window.addEventListener('keydown', e => {
      if (e.code === 'Space') {
        e.preventDefault();
        if (tool === 'line-tool') {
          spaceCycleIndex++;
          const names = ['Straight Line (Weld)', 'Smooth Curve', 'Quadratic Bezier (Arch)', 'Cubic Bezier (S-Curve)', 'Loop / Bow Bezier', 'Half-Circle'];
          const activeName = names[spaceCycleIndex % names.length];
          document.getElementById('hint').textContent = `SPACEBAR cycled instantly -> Active: ${activeName}`;
        }
      } else if (e.key.toLowerCase() === 'l') {
        tool = 'line-tool';
        document.querySelectorAll('.tool-btn').forEach(b => b.classList.toggle('active', b.dataset.tool === 'line-tool'));
      } else if (e.key.toLowerCase() === 's') {
        tool = 'shape-tool';
        document.querySelectorAll('.tool-btn').forEach(b => b.classList.toggle('active', b.dataset.tool === 'shape-tool'));
      }
    });

    redraw();
  </script>
</body>
</html>
