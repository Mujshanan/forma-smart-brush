<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>forma-smart-brush — Studio Test Page</title>
  <style>
    body { background: #121315; color: #dedee4; font-family: sans-serif; display: flex; height: 100vh; margin: 0; overflow: hidden; }
    .sidebar { width: 240px; background: #17181a; border-right: 1px solid #292a2f; display: flex; flex-direction: column; padding: 16px; gap: 16px; }
    .section-title { font-size: 12px; text-transform: uppercase; color: #a6a8b0; letter-spacing: 0.5px; margin-bottom: 8px; }
    .colors { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; }
    .color-btn { width: 100%; height: 32px; border: 2px solid transparent; border-radius: 6px; cursor: pointer; }
    .color-btn.active { border-color: #fff; }
    .brushes { display: flex; flex-direction: column; gap: 6px; }
    .brush-btn { background: #121315; border: 1px solid #292a2f; color: #dedee4; padding: 10px; border-radius: 6px; cursor: pointer; text-align: left; font-size: 13px; }
    .brush-btn:hover { background: #292a2f; }
    .brush-btn.active { border-color: #8d71ff; background: #34363c; color: #8d71ff; }
    .canvas-container { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; background: #121315; position: relative; }
    canvas { background: #faf9f5; border-radius: 8px; cursor: crosshair; box-shadow: 0 10px 30px rgba(0,0,0,0.5); }
    .hint { margin-top: 12px; font-size: 13px; color: #a6a8b0; }
    button { cursor: pointer; }
  </style>
  <script src="./dist/forma-smart-brush.umd.js"></script>
</head>
<body>
  <div class="sidebar">
    <div>
      <div class="section-title">Colors</div>
      <div class="colors">
        <button class="color-btn active" style="background: #a9ec68;" data-color="#a9ec68"></button>
        <button class="color-btn" style="background: #c4a6ff;" data-color="#c4a6ff"></button>
        <button class="color-btn" style="background: #ff8b78;" data-color="#ff8b78"></button>
        <button class="color-btn" style="background: #73c8ef;" data-color="#73c8ef"></button>
        <button class="color-btn" style="background: #ffd166;" data-color="#ffd166"></button>
        <button class="color-btn" style="background: #ffffff;" data-color="#ffffff"></button>
        <button class="color-btn" style="background: #191a1d;" data-color="#191a1d"></button>
        <input type="color" id="custom-color" value="#a9ec68" style="width: 100%; height: 32px; border: 1px solid #292a2f; background: #121315; border-radius: 6px; cursor: pointer; padding: 0;">
      </div>
    </div>
    <div>
      <div class="section-title">Brushes & Styles</div>
      <div class="brushes">
        <button class="brush-btn active" data-brush="ink">Ink (Tapered & Pressure)</button>
        <button class="brush-btn" data-brush="thick">Thick Marker</button>
        <button class="brush-btn" data-brush="pencil">Thin Pencil</button>
        <button class="brush-btn" data-brush="smooth">Ultra Smooth</button>
      </div>
    </div>
    <div style="margin-top: auto;">
      <button id="clear" style="width: 100%; background: transparent; border: 1px solid #292a2f; color: #dedee4; padding: 10px; border-radius: 6px; font-size: 13px;">Clear Canvas</button>
    </div>
  </div>

  <div class="canvas-container">
    <canvas id="canvas" width="800" height="500"></canvas>
    <div class="hint">Select a color and brush style from the sidebar. Draw pressure-sensitive strokes!</div>
  </div>

  <script>
    const canvas = document.getElementById('canvas');
    let smartBrush = new window.FormaSmartBrush.SmartBrushCanvas(canvas, { color: '#a9ec68', weldDistance: 30, size: 8 });

    // Color picker events
    document.querySelectorAll('.color-btn').forEach(btn => {
      btn.addEventListener('click', () => {
        document.querySelectorAll('.color-btn').forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
        const color = btn.dataset.color;
        smartBrush.options.color = color;
      });
    });

    document.getElementById('custom-color').addEventListener('input', e => {
      smartBrush.options.color = e.target.value;
    });

    // Brush style events
    document.querySelectorAll('.brush-btn').forEach(btn => {
      btn.addEventListener('click', () => {
        document.querySelectorAll('.brush-btn').forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
        const type = btn.dataset.brush;
        if (type === 'ink') {
          smartBrush.options.size = 8; smartBrush.options.thinning = 0.5; smartBrush.options.smoothing = 0.5;
        } else if (type === 'thick') {
          smartBrush.options.size = 18; smartBrush.options.thinning = 0.2; smartBrush.options.smoothing = 0.7;
        } else if (type === 'pencil') {
          smartBrush.options.size = 3; smartBrush.options.thinning = 0.1; smartBrush.options.smoothing = 0.3;
        } else if (type === 'smooth') {
          smartBrush.options.size = 10; smartBrush.options.thinning = 0.7; smartBrush.options.smoothing = 0.9;
        }
      });
    });

    document.getElementById('clear').addEventListener('click', () => {
      smartBrush.elements = [];
      smartBrush.redraw();
    });
  </script>
</body>
</html>
